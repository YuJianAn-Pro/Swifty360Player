name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show schemes (diagnostic)
        run: xcodebuild -workspace Swifty360Player.xcworkspace -list

      # 仓库里 Pods 已提交且 Manifest.lock 与 Podfile.lock 一致，
      # 但仍重新生成一次以匹配 runner 上的新 Xcode / CocoaPods。
      # 唯一依赖是本地 path pod，此步不需要联网。
      - name: Pod install
        run: pod install --no-repo-update

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Swifty360Player.xcworkspace \
            -scheme Sample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -40

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "Sample.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Swifty360Player-Sample-unsigned.ipa Payload
          ls -lh Swifty360Player-Sample-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swifty360Player-unsigned-ipa
          path: Swifty360Player-Sample-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
