name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show schemes (diagnostic)
        run: xcodebuild -workspace Swifty360Player.xcworkspace -list

      - name: Pod install
        run: pod install --no-repo-update

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Swifty360Player.xcworkspace \
            -scheme Sample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -40

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "Sample.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Swifty360Player-Sample-unsigned.ipa Payload
          ls -lh Swifty360Player-Sample-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swifty360Player-unsigned-ipa
          path: Swifty360Player-Sample-unsigned.ipa

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Unsigned IPA - Build #${{ github.run_number }}"
          body: |
            Auto-built unsigned Sample.ipa (Swifty360Player demo app).
            Download and sign it with Sideloadly / AltStore before installing on a device.
          files: Swifty360Player-Sample-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
